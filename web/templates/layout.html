{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageLense</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">PageLense</a>
  <span class="tagline">Web page analyzer</span>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}

{{define "form"}}
<form class="analyze" method="post" action="/analyze">
  <label for="url">Page URL</label>
  <div class="row">
    <input id="url" name="url" type="text" inputmode="url" placeholder="https://example.com" value="{{.URL}}" required autofocus>
    <button type="submit">Analyze</button>
  </div>
  <p class="hint">Include http:// or https://. Checking links can take a few seconds.</p>
</form>
{{end}}
