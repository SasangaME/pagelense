<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Newsletter</title>
</head>
<body>
  <h1>Stay in touch</h1>
  <form action="/subscribe" method="post">
    <label for="email">Email</label>

  <form action="/search">
    <input type="search" name="q">
  </form>
</body>
</html>
