global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pagelense-api
    static_configs:
      - targets: ["api:9091"]

  - job_name: pagelense-web
    static_configs:
      - targets: ["web:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
